difficulty_explanation = "Three connected tax features rebuilt on one codebase. (A) Replace the loose default-tax-rate setting with a unique default flag on tax rules, which touches the API, the backend, event copying/cloning, deletion rules, payment-fee taxation and three cancellation-fee taxation modes. That includes a gross-proportional fee splitter with remainder handling. (B) Add a side-effect-free dry run to event cancellation that predicts the exact automatic refund total. (C) Order-level tax rounding with a precise one-cent correction algorithm, applied consistently in cart and checkout totals, web and API order placement, payment changes and every order change including splits. The parts interact: fees taxed by (A) are rounded by (C), and cancellation fees from (A) flow through (B). About 1,430 existing tests must stay green, and a one-cent inconsistency in any path fails that path."
solution_explanation = "Add TaxRule.default (with a migration and uniqueness handling in the API, backend views, event copy/clone and delete checks), Event.cached_default_tax_rule, a backend set-default view, the tax_rule_payment and tax_rule_cancellation settings, and split_fee_for_taxes (gross-proportional, sorted by rate, remainder to the highest rate), and use them in payment-fee and cancellation-fee computation. Give cancel_event a dry_run that accumulates refund_total without writing anything. Implement apply_rounding plus the correction fields and Order.tax_rounding_mode, and call it wherever totals are built (cart/checkout views, order placement, API create/simulate with the pretixPOS fallback, payment changes, and the OrderChangeManager including split, via _recalculate_rounding_total_and_payment_fee)."
expert_time_estimate_hours = 20
