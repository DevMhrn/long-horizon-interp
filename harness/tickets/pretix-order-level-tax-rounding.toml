difficulty_explanation = "Money logic that cuts across the whole order lifecycle. Besides a correct rounding algorithm (per tax-rate group, minimum-currency-unit corrections, highest-gross-first distribution, revertible corrections, zero lines untouched, a fallback for gross prices that no net amount can produce, and currencies without decimals), the agent must apply it consistently in the cart and checkout totals, web order placement, API order creation and simulation, payment-method and payment-fee changes, and every order change including splits. Each order must snapshot its rounding mode. Fees need aliases so they round like positions, and legacy point-of-sale clients need a fallback. A one-cent inconsistency in any single path fails tests in that path, and the default mode must leave ~690 existing tests byte-identical. There is no existing pattern in the codebase to copy."
solution_explanation = "Add the correction fields (positions, cart positions, fees) plus Order.tax_rounding_mode with a migration, and an event setting tax_rounding. Implement apply_rounding in the pricing service: group by (tax rate, tax code), sort by gross price descending, compute the target gross (sum_by_net) or target net plus nearest achievable gross (keep_gross), and distribute one-unit corrections, reverting stale ones. Call it wherever totals are built: cart and checkout views, order placement, API create/simulate (with the pretixPOS fallback), payment fee changes, and the OrderChangeManager (rename _recalculate_total_and_payment_fee to _recalculate_rounding_total_and_payment_fee and round there, including on split). Expose tax_rounding_mode in the order serializer."
expert_time_estimate_hours = 12
